workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^slopguard-cli-v/'
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE =~ /^chore: release/'
      variables:
        RELEASE_COMMIT: "true"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - check
  - test
  - build
  - release

default:
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - api_failure

variables:
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  GIT_DEPTH: 20
  FF_USE_FASTZIP: "1"
  CACHE_COMPRESSION_LEVEL: "fastest"
  RELEASE_PLZ_VERSION: "0.3.160"
  CARGO_HTTP_TIMEOUT: "180"
  CARGO_NET_RETRY: "5"
  # Shared compilation cache on the homelab MinIO, same settings as ironflow.
  # Jobs that compile source ci/sccache-setup.sh (see .sccache), which drops the
  # wrapper when the cache is unusable.
  RUSTC_WRAPPER: sccache
  CARGO_INCREMENTAL: "0"
  SCCACHE_BUCKET: sccache
  SCCACHE_ENDPOINT: http://minio.ci.svc.cluster.local:9000
  SCCACHE_REGION: us-east-1
  SCCACHE_S3_USE_SSL: "false"
  SCCACHE_S3_KEY_PREFIX: slopguard
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
  # The rust version must match the channel in rust-toolchain.toml, otherwise
  # rustup downloads that toolchain in every job, without the cross targets.
  CI_RUST_IMAGE: "${CI_REGISTRY_IMAGE}/ci-rust:rust-1.94.1-v2"

.rust-cache: &rust-cache
  cache:
    key: rust-${CI_COMMIT_REF_SLUG}
    fallback_keys:
      - rust-${CI_DEFAULT_BRANCH}
    paths:
      - .cargo/registry/cache/
      - .cargo/registry/index/
      - .cargo/git/db/

.install-release-plz: &install-release-plz
  - mkdir -p "${CI_PROJECT_DIR}/.cargo/bin"
  - |
    case "$(uname -s)-$(uname -m)" in
      Linux-aarch64)  ARCH="aarch64-unknown-linux-musl" ;;
      Linux-x86_64)   ARCH="x86_64-unknown-linux-musl" ;;
      Darwin-arm64)   ARCH="aarch64-apple-darwin" ;;
      *)              ARCH="x86_64-unknown-linux-musl" ;;
    esac
  - curl -sSfL "https://github.com/release-plz/release-plz/releases/download/release-plz-v${RELEASE_PLZ_VERSION}/release-plz-${ARCH}.tar.gz" | tar -xz -C "${CI_PROJECT_DIR}/.cargo/bin" release-plz
  - export PATH="${CI_PROJECT_DIR}/.cargo/bin:$PATH"
  - release-plz --version

# Every job that compiles extends this (cargo fmt and cargo audit never call
# the wrapper). A job with its own before_script pulls it in with !reference.
.sccache:
  before_script:
    - . ci/sccache-setup.sh
  after_script:
    - command -v sccache >/dev/null 2>&1 && sccache --show-stats || true

# Validation jobs run only on MR pipelines.
# Code is already validated before reaching main.
# Release MRs from release-plz only bump Cargo.toml + CHANGELOG -- skip validation.
.only-mr:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /^chore: release/'
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ---------------------------------------------------------------------------
# CI IMAGE
# ---------------------------------------------------------------------------

# Only main publishes the image: an MR build validates the Dockerfile without
# pushing, so it can never overwrite the tag main depends on. The runner pulls
# with IfNotPresent, so a changed image needs a new CI_RUST_IMAGE tag (bumping it
# in this file is enough to republish).
build-ci-image:
  stage: check
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf '%s:%s' "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64)\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}/ci/rust"
      --dockerfile "${CI_PROJECT_DIR}/ci/rust/Dockerfile"
      --destination "$CI_RUST_IMAGE"
      --custom-platform=linux/amd64
      $KANIKO_PUSH_ARGS
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - ci/rust/Dockerfile
      variables:
        KANIKO_PUSH_ARGS: "--no-push"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - ci/rust/Dockerfile
        - .gitlab-ci.yml

# ---------------------------------------------------------------------------
# CHECK
# ---------------------------------------------------------------------------

cargo-fmt:
  extends: .only-mr
  stage: check
  image: $CI_RUST_IMAGE
  <<: *rust-cache
  needs:
    - job: build-ci-image
      optional: true
  variables:
    RUSTFLAGS: "-D warnings"
  script:
    - cargo fmt --all -- --check

cargo-clippy:
  extends: [.only-mr, .sccache]
  stage: check
  image: $CI_RUST_IMAGE
  <<: *rust-cache
  needs:
    - job: build-ci-image
      optional: true
  variables:
    RUSTFLAGS: "-D warnings"
  script:
    - cargo clippy --workspace --all-targets -- -D warnings

cargo-audit:
  extends: .only-mr
  stage: check
  image: $CI_RUST_IMAGE
  <<: *rust-cache
  needs:
    - job: build-ci-image
      optional: true
  script:
    - cargo audit
  allow_failure: false

# ---------------------------------------------------------------------------
# TEST
# ---------------------------------------------------------------------------

unit-tests:
  extends: [.only-mr, .sccache]
  stage: test
  image: $CI_RUST_IMAGE
  <<: *rust-cache
  needs:
    - job: build-ci-image
      optional: true
  variables:
    RUSTFLAGS: "-D warnings"
  script:
    - cargo nextest run --workspace

doc-tests:
  extends: [.only-mr, .sccache]
  stage: test
  image: $CI_RUST_IMAGE
  <<: *rust-cache
  needs:
    - job: build-ci-image
      optional: true
  variables:
    RUSTFLAGS: "-D warnings"
  script:
    - cargo test --workspace --doc

# ---------------------------------------------------------------------------
# BUILD
# ---------------------------------------------------------------------------

build-release:
  extends: .sccache
  stage: build
  image: $CI_RUST_IMAGE
  <<: *rust-cache
  script:
    - cargo build --workspace --release
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $RELEASE_COMMIT != "true"

# ---------------------------------------------------------------------------
# RELEASE
# ---------------------------------------------------------------------------

release-plz-update:
  stage: release
  image: $CI_RUST_IMAGE
  <<: *rust-cache
  needs:
    - build-release
  variables:
    GIT_DEPTH: 0
  before_script:
    - !reference [.sccache, before_script]
    - *install-release-plz
  after_script:
    - !reference [.sccache, after_script]
  script:
    - git config user.name "release-plz[bot]"
    - git config user.email "release-plz@users.noreply.gitlab.com"
    - git remote set-url origin "https://gitlab-ci-token:${GITLAB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
    - git fetch origin "$CI_COMMIT_BRANCH"
    - git checkout -B "$CI_COMMIT_BRANCH" "origin/$CI_COMMIT_BRANCH"
    - release-plz release-pr --forge gitlab --git-token "$GITLAB_TOKEN"
    - |
      MR_IID=$(curl -s --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
        "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/merge_requests?state=opened&search=release-plz&in=source_branch&per_page=1" \
        | python3 -c "import sys,json; mrs=json.load(sys.stdin); print(mrs[0]['iid'] if mrs else '')")
      if [ -n "$MR_IID" ]; then
        for i in 1 2 3 4 5 6; do
          RESP=$(curl -s --request PUT --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/merge_requests/$MR_IID/merge" \
            --data "merge_when_pipeline_succeeds=true")
          echo "$RESP"
          echo "$RESP" | grep -q '"merge_when_pipeline_succeeds":true' && break
          sleep 10
        done
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $RELEASE_COMMIT != "true"

release-plz-release:
  stage: release
  image: $CI_RUST_IMAGE
  <<: *rust-cache
  needs:
    - job: build-release
      optional: true
  variables:
    GIT_DEPTH: 0
  before_script:
    - !reference [.sccache, before_script]
    - *install-release-plz
  after_script:
    - !reference [.sccache, after_script]
  script:
    - git remote set-url origin "https://gitlab-ci-token:${GITLAB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
    - git fetch origin "$CI_COMMIT_BRANCH"
    - git checkout -B "$CI_COMMIT_BRANCH" "origin/$CI_COMMIT_BRANCH"
    - release-plz release --forge gitlab --git-token "$GITLAB_TOKEN"
  retry:
    max: 2
    when:
      - script_failure
      - runner_system_failure
      - stuck_or_timeout_failure
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------------------
# BINARY RELEASES (tag pipelines only)
# ---------------------------------------------------------------------------

build-binaries:
  extends: .sccache
  stage: release
  image: $CI_RUST_IMAGE
  <<: *rust-cache
  needs: []
  # No darwin targets: reqwest links the Security and SystemConfiguration
  # frameworks, which zig cannot provide without an Apple SDK.
  parallel:
    matrix:
      - TARGET: x86_64-unknown-linux-gnu
      - TARGET: x86_64-unknown-linux-musl
  script:
    - VERSION="${CI_COMMIT_TAG#slopguard-cli-v}"
    - |
      if [ "$TARGET" = "x86_64-unknown-linux-gnu" ]; then
        rustup target add x86_64-unknown-linux-gnu 2>/dev/null || true
        cargo build -p slopguard-cli --release --target "$TARGET"
      else
        cargo zigbuild -p slopguard-cli --release --target "$TARGET"
      fi
    - DIST="slopguard-${VERSION}-${TARGET}"
    - mkdir -p "dist/${DIST}"
    - cp "target/${TARGET}/release/slopguard" "dist/${DIST}/"
    - cp LICENSE "dist/${DIST}/"
    - |
      cat > "dist/${DIST}/README.md" <<INNER
      # slopguard

      Catch AI-generated code patterns via static analysis.

      https://gitlab.com/ThomasTartrau/slopguard
      INNER
    - tar -czf "dist/${DIST}.tar.gz" -C dist "${DIST}"
    - sh ci/publish-asset.sh "dist/${DIST}.tar.gz" package
  artifacts:
    paths:
      - dist/*.tar.gz
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_TAG =~ /^slopguard-cli-v/'

publish-checksums:
  stage: release
  image: $CI_RUST_IMAGE
  needs:
    - job: build-binaries
      artifacts: true
  script:
    - (cd dist && sha256sum *.tar.gz > SHA256SUMS)
    - cat dist/SHA256SUMS
    - sh ci/publish-asset.sh dist/SHA256SUMS other
  rules:
    - if: '$CI_COMMIT_TAG =~ /^slopguard-cli-v/'
