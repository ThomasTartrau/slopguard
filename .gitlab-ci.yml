workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE =~ /^chore: release/'
      variables:
        RELEASE_COMMIT: "true"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - check
  - test
  - build
  - release

default:
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - api_failure

variables:
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  GIT_DEPTH: 20
  FF_USE_FASTZIP: "1"
  CACHE_COMPRESSION_LEVEL: "fastest"
  RELEASE_PLZ_VERSION: "0.3.160"
  CARGO_HTTP_TIMEOUT: "180"
  CARGO_NET_RETRY: "5"

.rust-cache: &rust-cache
  cache:
    key: rust-${CI_COMMIT_REF_SLUG}
    fallback_keys:
      - rust-${CI_DEFAULT_BRANCH}
    paths:
      - .cargo/registry/cache/
      - .cargo/registry/index/
      - .cargo/git/db/

.install-release-plz: &install-release-plz
  - mkdir -p "${CI_PROJECT_DIR}/.cargo/bin"
  - curl -sSfL "https://github.com/release-plz/release-plz/releases/download/release-plz-v${RELEASE_PLZ_VERSION}/release-plz-aarch64-apple-darwin.tar.gz" | tar -xz -C "${CI_PROJECT_DIR}/.cargo/bin" release-plz
  - export PATH="${CI_PROJECT_DIR}/.cargo/bin:$PATH"
  - release-plz --version

# Validation jobs run only on MR pipelines.
# Code is already validated before reaching main.
# Release MRs from release-plz only bump Cargo.toml + CHANGELOG -- skip validation.
.only-mr:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /^chore: release/'
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ---------------------------------------------------------------------------
# CHECK
# ---------------------------------------------------------------------------

cargo-fmt:
  extends: .only-mr
  stage: check
  <<: *rust-cache
  variables:
    RUSTFLAGS: "-D warnings"
  script:
    - cargo fmt --all -- --check

cargo-clippy:
  extends: .only-mr
  stage: check
  <<: *rust-cache
  variables:
    RUSTFLAGS: "-D warnings"
  script:
    - cargo clippy --workspace --all-targets -- -D warnings

cargo-audit:
  extends: .only-mr
  stage: check
  <<: *rust-cache
  script:
    - cargo audit
  allow_failure: false

# ---------------------------------------------------------------------------
# TEST
# ---------------------------------------------------------------------------

unit-tests:
  extends: .only-mr
  stage: test
  <<: *rust-cache
  needs: []
  variables:
    RUSTFLAGS: "-D warnings"
  script:
    - cargo nextest run --workspace

doc-tests:
  extends: .only-mr
  stage: test
  <<: *rust-cache
  needs: []
  variables:
    RUSTFLAGS: "-D warnings"
  script:
    - cargo test --workspace --doc

# ---------------------------------------------------------------------------
# BUILD
# ---------------------------------------------------------------------------

build-release:
  stage: build
  <<: *rust-cache
  script:
    - cargo build --workspace --release
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $RELEASE_COMMIT != "true"

# ---------------------------------------------------------------------------
# RELEASE
# ---------------------------------------------------------------------------

release-plz-update:
  stage: release
  <<: *rust-cache
  needs:
    - build-release
  variables:
    GIT_DEPTH: 0
  before_script:
    - *install-release-plz
  script:
    - git config user.name "release-plz[bot]"
    - git config user.email "release-plz@users.noreply.gitlab.com"
    - git remote set-url origin "https://gitlab-ci-token:${GITLAB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
    - git fetch origin "$CI_COMMIT_BRANCH"
    - git checkout -B "$CI_COMMIT_BRANCH" "origin/$CI_COMMIT_BRANCH"
    - release-plz release-pr --forge gitlab --git-token "$GITLAB_TOKEN"
    - |
      MR_IID=$(curl -s --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
        "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/merge_requests?state=opened&search=release-plz&in=source_branch&per_page=1" \
        | python3 -c "import sys,json; mrs=json.load(sys.stdin); print(mrs[0]['iid'] if mrs else '')")
      if [ -n "$MR_IID" ]; then
        for i in 1 2 3 4 5 6; do
          RESP=$(curl -s --request PUT --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/merge_requests/$MR_IID/merge" \
            --data "merge_when_pipeline_succeeds=true")
          echo "$RESP"
          echo "$RESP" | grep -q '"merge_when_pipeline_succeeds":true' && break
          sleep 10
        done
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $RELEASE_COMMIT != "true"

release-plz-release:
  stage: release
  <<: *rust-cache
  needs:
    - job: build-release
      optional: true
  variables:
    GIT_DEPTH: 0
  before_script:
    - *install-release-plz
  script:
    - git remote set-url origin "https://gitlab-ci-token:${GITLAB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
    - git fetch origin "$CI_COMMIT_BRANCH"
    - git checkout -B "$CI_COMMIT_BRANCH" "origin/$CI_COMMIT_BRANCH"
    - release-plz release --forge gitlab --git-token "$GITLAB_TOKEN"
  retry:
    max: 2
    when:
      - script_failure
      - runner_system_failure
      - stuck_or_timeout_failure
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
