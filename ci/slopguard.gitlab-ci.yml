# slopguard GitLab CI template
#
# Include this in your .gitlab-ci.yml:
#
#   include:
#     - remote: 'https://gitlab.com/ThomasTartrau/slopguard/-/raw/main/ci/slopguard.gitlab-ci.yml'
#
# Or copy this file into your project.
#
# Trust model: AI and classifier settings ([ai], [ai.classifier]) and
# scan.cache_dir are ignored in the scanned repo's slopguard.toml, with a
# warning. Put them in the runner's global config
# (~/.config/slopguard/config.toml, or $XDG_CONFIG_HOME/slopguard/config.toml),
# or add --trust-repo-config to the scan command for repositories you trust
# (never on merge requests from forks). The cache dir is passed explicitly
# below with --cache-dir.
#
# Cache entries are signed with a per-user key in
# $XDG_CACHE_HOME/slopguard/cache.key (~/.cache/slopguard/cache.key), outside
# the checkout, so entries committed to the repository are never trusted. The
# key is not part of the cached paths below: entries restored from a previous
# job only hit when the runner keeps its home cache directory between jobs.

slopguard:
  image: rust:latest
  cache:
    key: slopguard-${CI_COMMIT_REF_SLUG}
    paths:
      - .cache/slopguard/
  before_script:
    - cargo install slopguard-cli
  script:
    - slopguard scan . --cache-dir .cache/slopguard/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
