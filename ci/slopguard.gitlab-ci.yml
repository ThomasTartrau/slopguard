# slopguard GitLab CI template
#
# Include this in your .gitlab-ci.yml:
#
#   include:
#     - remote: 'https://gitlab.com/ThomasTartrau/slopguard/-/raw/main/ci/slopguard.gitlab-ci.yml'
#
# Or copy this file into your project.
#
# Trust model: AI and classifier settings ([ai], [ai.classifier]) and
# scan.cache_dir are ignored in the scanned repo's slopguard.toml, with a
# warning. Put them in the runner's global config
# (~/.config/slopguard/config.toml, or $XDG_CONFIG_HOME/slopguard/config.toml),
# or add --trust-repo-config to the scan command for repositories you trust
# (never on merge requests from forks). The cache dir is passed explicitly
# below with --cache-dir.
#
# Cache entries are signed with a per-user key in
# $XDG_CACHE_HOME/slopguard/cache.key (~/.cache/slopguard/cache.key), outside
# the checkout, so entries committed to the repository are never trusted. To
# keep cache hits across jobs, the key is copied in and out of the cached path
# .cache/slopguard-key/ (outside --cache-dir, so a stale cache dir never
# carries it). The copy is skipped, and the restored path deleted, whenever any
# file under that path is tracked by git: a key committed to the repository is
# never installed. Alternatively, mount a runner-level volume on
# $XDG_CACHE_HOME/slopguard and drop the key paths below.

slopguard:
  image: rust:latest
  variables:
    SLOPGUARD_KEY_CACHE: .cache/slopguard-key
  cache:
    key: slopguard-${CI_COMMIT_REF_SLUG}
    paths:
      - .cache/slopguard/
      - .cache/slopguard-key/
  before_script:
    - cargo install slopguard-cli
    - |
      KEY_DIR="${XDG_CACHE_HOME:-$HOME/.cache}/slopguard"
      if git ls-files -- "$SLOPGUARD_KEY_CACHE" | grep -q .; then
        rm -rf "$SLOPGUARD_KEY_CACHE"
      elif [ -f "$SLOPGUARD_KEY_CACHE/cache.key" ] && [ ! -L "$SLOPGUARD_KEY_CACHE/cache.key" ]; then
        mkdir -p "$KEY_DIR"
        cp "$SLOPGUARD_KEY_CACHE/cache.key" "$KEY_DIR/cache.key"
        chmod 600 "$KEY_DIR/cache.key"
      fi
  script:
    - slopguard scan . --cache-dir .cache/slopguard/
  after_script:
    - |
      KEY_DIR="${XDG_CACHE_HOME:-$HOME/.cache}/slopguard"
      if ! git ls-files -- "$SLOPGUARD_KEY_CACHE" | grep -q . \
        && [ -f "$KEY_DIR/cache.key" ] && [ ! -L "$KEY_DIR/cache.key" ]; then
        mkdir -p "$SLOPGUARD_KEY_CACHE"
        cp "$KEY_DIR/cache.key" "$SLOPGUARD_KEY_CACHE/cache.key"
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
