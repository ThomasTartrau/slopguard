[package]
name = "slopguard-ai"
version = "0.1.32"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "AI analysis pipeline for slopguard (LLM provider, prompt, cache)"
readme = "README.md"

[features]
# The System One classifier (Jev / TypeSafe). Off by default: opt-in strict,
# since Jev is a proprietary SaaS and the deterministic AST mode is the socle.
provider-typesafe = ["ironflow-core/provider-typesafe"]

[dependencies]
slopguard-core = { path = "../slopguard-core", version = "0.1.32" }
ironflow-core = { version = "3.18.0", features = [
    "provider-anthropic-api",
    "provider-openai",
] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
