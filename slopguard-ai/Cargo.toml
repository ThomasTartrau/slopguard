[package]
name = "slopguard-ai"
version = "0.1.14"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "AI analysis pipeline for slopguard (LLM provider, prompt, cache)"
readme = "README.md"

[dependencies]
slopguard-core = { path = "../slopguard-core", version = "0.1.15" }
ironflow-core = { version = "3.15.1", features = [
    "provider-anthropic-api",
    "provider-openai",
] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
