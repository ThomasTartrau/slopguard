[package]
name = "slopguard-cli"
version = "0.1.11"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "CLI tool to catch AI-generated code patterns via static analysis"
readme = "README.md"

[[bin]]
name = "slopguard"
path = "src/main.rs"

[dependencies]
slopguard-core = { path = "../slopguard-core", version = "0.1.10" }
slopguard-ai = { path = "../slopguard-ai", version = "0.1.9" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
strsim = "0.11"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
serde_json = "1"
