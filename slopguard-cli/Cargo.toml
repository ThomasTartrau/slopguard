[package]
name = "slopguard-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "CLI tool to catch AI-generated code patterns via static analysis"

[[bin]]
name = "slopguard"
path = "src/main.rs"

[dependencies]
slopguard-core = { path = "../slopguard-core", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
serde_json = "1"
