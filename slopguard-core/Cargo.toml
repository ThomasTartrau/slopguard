[package]
name = "slopguard-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
ast-grep-core = "0.45"
ast-grep-config = "0.45"
ast-grep-language = "0.45"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
ignore = "0.4"
strum = { version = "0.27", features = ["derive"] }
thiserror = "2"
serde_yaml = "0.9"
slopguard-rules = { path = "../slopguard-rules" }
dirs = "7.0.0"
smart-default = "0.7.1"
globset = "0.4"
rayon = "1"

[dev-dependencies]
tempfile = "3"
