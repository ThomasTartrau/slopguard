id: no-assertion-free-test
language: rust
severity: warning
category: correctness
cross_file: assertion_free_test
message: "Test function with no assertion. It passes as long as the code does not panic, proving nothing."
note: "A #[test] with no assert!/panic!, no ? propagation, no .unwrap()/.expect(), no inline snapshot and no #[should_panic] only checks that the code runs. Helpers are followed across the project: a test calling test code that asserts (a #[cfg(test)] function, a file under tests/, a crate used only as a dev-dependency) is fine, and so is a compile-only test that just declares items or typed `let _: T` bindings. For test helpers from outside the project, list them under [rules.options.no-assertion-free-test] assert_functions."
fix: "Assert the expected result, or return Result and use ? so an error fails the test."
# trybuild fixtures (tests/ui, tests/fail, tests/pass) are compiler inputs, not
# tests that run.
ignores:
  - "**/fixtures/**"
  - "**/tests/ui/**"
  - "**/tests/fail/**"
  - "**/tests/pass/**"
