id: no-async-foreach
language: typescript
severity: error
category: correctness
message: "Async callback in forEach/map/filter/reduce. Use for...of or Promise.all(arr.map(...))."
note: "forEach ignores the returned Promise, callbacks run in parallel without await."
rule:
  any:
    - pattern: $ARR.forEach(async ($$$) => { $$$ })
    - pattern: $ARR.forEach(async function($$$) { $$$ })
    - pattern: $ARR.map(async ($$$) => { $$$ })
    - pattern: $ARR.filter(async ($$$) => { $$$ })
    - pattern: $ARR.reduce(async ($$$) => { $$$ })
ignores:
  - "**/fixtures/**"
tests:
  should_match:
    - "items.forEach(async (item) => { await process(item); })"
    - "items.map(async (item) => { await transform(item); })"
  should_not_match:
    - "items.forEach((item) => { process(item); })"
    - "await Promise.all(items.map((item) => process(item)));"
