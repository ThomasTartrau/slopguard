id: no-dead-branch
language: typescript
severity: warning
category: correctness
message: "Tautological branch condition. Remove the dead branch."
note: "if (true) / if (x === x) are debug residue that never varies."
rule:
  any:
    - pattern: if (true) { $$$ }
    - pattern: if (false) { $$$ }
    - pattern: if ($X === $X) { $$$ }
    - pattern: if ($X == $X) { $$$ }
ignores:
  - "**/fixtures/**"
tests:
  should_match:
    - "if (true) { doStuff(); }"
    - "if (1 === 1) { run(); }"
  should_not_match:
    - "if (x > 0) { run(); }"
    - "if (isReady) { go(); }"
