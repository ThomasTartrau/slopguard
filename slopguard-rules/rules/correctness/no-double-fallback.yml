id: no-double-fallback
language: rust
severity: warning
category: correctness
message: "Silent double fallback. One fallback layer max, propagate the rest."
note: "Chaining .ok().unwrap_or() or .unwrap_or().unwrap_or() hides two error levels."
rule:
  kind: call_expression
  regex: '\.(ok|unwrap_or|unwrap_or_default|unwrap_or_else)\(.*\)\.(unwrap_or|unwrap_or_default|unwrap_or_else|and_then|map)\('
ignores:
  - "**/tests/**"
  - "**/test_*"
  - "**/*_test.rs"
  - "**/fixtures/**"
skip_test_code: true
tests:
  should_match:
    - 'let val = result.ok().unwrap_or("default");'
    - 'let x = a.unwrap_or(0).unwrap_or_default();'
  should_not_match:
    - 'let val = result.unwrap_or("default");'
    - "let x = result?;"
