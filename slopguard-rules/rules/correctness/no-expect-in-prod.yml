id: no-expect-in-prod
language: rust
severity: error
category: correctness
message: ".expect() forbidden in production. Use ? or match."
note: "expect() allowed only in tests and server startup (main). In a handler/service it crashes the process."
rule:
  kind: call_expression
  regex: '\.expect\('
ignores:
  - "**/tests/**"
  - "**/test_*"
  - "**/*_test.rs"
  - "**/examples/**"
  - "**/benches/**"
  - "**/main.rs"
skip_test_code: true
tests:
  should_match:
    - 'let conn = pool.get().expect("pool exhausted");'
    - 'let val = map.get("key").expect("missing key");'
  should_not_match:
    - "let conn = pool.get()?;"
    - |
      match pool.get() {
          Ok(conn) => conn,
          Err(e) => return Err(e.into()),
      }
