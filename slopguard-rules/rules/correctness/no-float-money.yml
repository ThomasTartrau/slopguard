id: no-float-money
language: rust
severity: error
category: correctness
message: "FLOAT/REAL/DOUBLE in SQL. Use BIGINT (cents) or DECIMAL for monetary values."
note: "Floating point loses precision on monetary calculations."
rule:
  kind: string_literal
  regex: '\b(FLOAT|REAL|DOUBLE\s+PRECISION)\b'
files:
  - "**/migrations/**/*.rs"
  - "**/migrate/**/*.rs"
ignores:
  - "**/fixtures/**"
tests:
  should_match:
    - '"ALTER TABLE orders ADD COLUMN amount FLOAT"'
    - '"CREATE TABLE invoices (total DOUBLE PRECISION)"'
  should_not_match:
    - '"ALTER TABLE orders ADD COLUMN amount BIGINT"'
    - '"CREATE TABLE invoices (total DECIMAL(10,2))"'
