id: no-ignored-result
language: rust
severity: warning
category: correctness
message: "Result ignored via let _ =. Handle the error with ?, if let Err(e), or log."
note: "let _ = on a fallible call silently swallows errors. Acceptable for broadcast channel .send() where no receivers is expected."
rule:
  pattern: let _ = $EXPR;
  not:
    regex: '\.(send|try_send)\('
ignores:
  - "**/tests/**"
  - "**/test_*"
  - "**/*_test.rs"
  - "**/examples/**"
skip_test_code: true
tests:
  should_match:
    - "let _ = fs::remove_file(path);"
    - "let _ = db.execute(query).await;"
  should_not_match:
    - "fs::remove_file(path)?;"
    - "let _ = sender.send(msg);"
