id: no-unwrap-in-prod
language: rust
severity: error
category: correctness
message: ".unwrap() forbidden in production. Use ? or .expect('explicit message')."
note: "unwrap() crashes the process on a single invalid input."
rule:
  kind: call_expression
  regex: '\.unwrap\(\)\s*$'
ignores:
  - "**/tests/**"
  - "**/test_*"
  - "**/*_test.rs"
  - "**/examples/**"
  - "**/benches/**"
tests:
  should_match:
    - "let user = db.get_user(id).unwrap();"
    - "let val = config.get(\"key\").unwrap();"
  should_not_match:
    - "let user = db.get_user(id)?;"
    - "let user = db.get_user(id).expect(\"user must exist after auth\");"
