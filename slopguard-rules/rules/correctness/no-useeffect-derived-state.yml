id: no-useeffect-derived-state
language: typescript
severity: warning
category: correctness
message: "useEffect for derived state. Use useMemo or compute directly in the render."
note: "useEffect + setState to derive a value causes an unnecessary re-render and sync bugs."
rule:
  kind: call_expression
  all:
    - has:
        field: function
        regex: '^useEffect$'
    - has:
        field: arguments
        has:
          kind: arrow_function
          has:
            kind: call_expression
            regex: '^set[A-Z]\w*\('
            stopBy: end
ignores:
  - "**/fixtures/**"
tests:
  should_match:
    - |
      useEffect(() => {
        setFullName(first + ' ' + last);
      }, [first, last]);
    - |
      useEffect(() => {
        setTotal(items.reduce((sum, i) => sum + i.price, 0));
      }, [items]);
  should_not_match:
    - "const fullName = useMemo(() => first + ' ' + last, [first, last]);"
    - "const total = items.reduce((sum, i) => sum + i.price, 0);"
