id: pub-fn-needs-tracing
language: rust
severity: warning
category: correctness
message: "Public async method without #[tracing::instrument]. Breaks OTel trace continuity."
note: "Add #[tracing::instrument(skip(self))] or skip_all depending on context."
rule:
  kind: function_item
  all:
    - has:
        kind: visibility_modifier
        regex: '^pub'
    - regex: '\basync\b'
    - not:
        follows:
          kind: attribute_item
          regex: 'tracing::instrument'
          stopBy:
            not:
              kind: attribute_item
files:
  - "**/src/**/*.rs"
ignores:
  - "**/tests/**"
  - "**/test_*"
  - "**/*_test.rs"
  - "**/main.rs"
  - "**/lib.rs"
  - "**/mod.rs"
  - "**/examples/**"
  - "**/fixtures/**"
skip_test_code: true
tests:
  should_match:
    - |
      pub async fn fetch_orders(pool: &PgPool) -> Result<Vec<Order>> {
          todo!()
      }
    - |
      pub async fn create_user(name: &str) -> Result<User> {
          Ok(User { name: name.to_string() })
      }
  should_not_match:
    - |
      #[tracing::instrument(skip(self))]
      pub async fn fetch_orders(pool: &PgPool) -> Result<Vec<Order>> {
          todo!()
      }
    - |
      pub fn new(name: &str) -> Self {
          Self { name: name.to_string() }
      }
