id: no-empty-env-secret
language: rust
severity: error
category: security
message: "std::env::var() without empty value rejection. An empty string silently disables auth."
note: "After env::var(), filter with .filter(|s| !s.is_empty()) or validate at startup."
rule:
  kind: call_expression
  all:
    - has:
        field: function
        regex: 'env::var$'
    - has:
        field: arguments
        has:
          kind: string_literal
          regex: '(?i)(secret|token|key|password|auth([^o]|o[^r])|jwt|hmac|signing|webhook)'
    - not:
        has:
          field: arguments
          has:
            kind: string_literal
            regex: '(?i)(_URL|_HOST|_ENDPOINT|_PATH)"$'
    - not:
        inside:
          kind: call_expression
          stopBy: end
          all:
            - has:
                field: function
                kind: field_expression
                has:
                  field: field
                  regex: '^filter$'
            - has:
                field: arguments
                regex: 'is_empty'
ignores:
  - "**/tests/**"
  - "**/*_tests/**"
  - "**/*_test/**"
  - "**/test_*"
  - "**/*_test.rs"
  - "**/fixtures/**"
skip_test_code: true
tests:
  should_match:
    - 'let secret = env::var("JWT_SECRET").unwrap();'
    - 'let key = std::env::var("API_KEY_PRODUCTION").ok();'
    - 'let t = env::var("GITHUB_AUTHTOKEN").ok();'
    - 'let t = env::var("GIT_AUTHOR_TOKEN").ok();'
  should_not_match:
    - 'let port = env::var("PORT").unwrap();'
    - 'let name = std::env::var("APP_NAME").ok();'
    - 'let n = env::var("MAX_RUNS_PER_AUTHOR_PER_HOUR").ok();'
    - 'let u = env::var("AUTH_PROXY_URL").ok();'
    - 'let s = env::var("JWT_SECRET").ok().filter(|s| !s.trim().is_empty());'
