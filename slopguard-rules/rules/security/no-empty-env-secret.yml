id: no-empty-env-secret
language: rust
severity: error
category: security
message: "std::env::var() without empty value rejection. An empty string silently disables auth."
note: "After env::var(), filter with .filter(|s| !s.is_empty()) or validate at startup."
rule:
  kind: call_expression
  all:
    - has:
        field: function
        regex: 'env::var$'
    - has:
        field: arguments
        has:
          kind: string_literal
          regex: '(?i)(secret|token|key|password|auth|jwt|hmac|signing|webhook)'
ignores:
  - "**/tests/**"
  - "**/test_*"
  - "**/*_test.rs"
  - "**/fixtures/**"
skip_test_code: true
tests:
  should_match:
    - 'let secret = env::var("JWT_SECRET").unwrap();'
    - 'let key = std::env::var("API_KEY_PRODUCTION").ok();'
  should_not_match:
    - 'let port = env::var("PORT").unwrap();'
    - 'let name = std::env::var("APP_NAME").ok();'
