id: no-empty-env-secret
language: rust
severity: error
message: "std::env::var() without empty value rejection. An empty string silently disables auth."
note: "After env::var(), filter with .filter(|s| !s.is_empty()) or validate at startup."
rule:
  kind: call_expression
  all:
    - regex: 'env::var\('
    - regex: '(secret|token|key|password|auth|jwt|hmac|signing|webhook)'
ignores:
  - "**/tests/**"
  - "**/test_*"
  - "**/*_test.rs"
