id: no-format-url
language: rust
severity: error
category: security
message: "format!() to build a URL. Use Url::parse(), .query(), or .join()."
note: "Parameter injection or path traversal risk if the input contains &, =, / or .."
rule:
  kind: macro_invocation
  all:
    - has:
        field: macro
        regex: '^format$'
    - has:
        kind: string_literal
        regex: '(https?://|\{[^}]*(url|host|base|endpoint)[^}]*\}/|\{[^}]*(id|name|key|uid|slug)[^}]*\})'
ignores:
  - "**/tests/**"
  - "**/test_*"
  - "**/*_test.rs"
tests:
  should_match:
    - 'let url = format!("https://api.example.com/users/{}", user_id);'
    - 'let url = format!("{base_url}/items/{id}");'
  should_not_match:
    - 'let msg = format!("connected to {}", host);'
    - 'let label = format!("user-{}", count);'
