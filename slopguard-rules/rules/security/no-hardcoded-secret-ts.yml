id: no-hardcoded-secret
language: typescript
severity: error
category: security
message: "Hardcoded secret in source code. Use environment variables or a vault."
note: "Secrets in source code end up in version control and logs."
rule:
  kind: variable_declarator
  all:
    - has:
        kind: identifier
        regex: '(api_key|apiKey|secret|password|token|credential|authToken|webhookSecret|signingKey|privateKey|accessKey|secretKey|apiSecret|clientSecret|encryptionKey)$'
        stopBy: end
    - has:
        kind: string
        stopBy: end
ignores:
  - "**/fixtures/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/__tests__/**"
tests:
  should_match:
    - 'const apiKey = "sk-abc123456";'
    - 'const password = "hunter2";'
  should_not_match:
    - 'const apiKey = process.env.API_KEY;'
    - 'const name = "John";'
