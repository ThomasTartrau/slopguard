id: no-safety-hallucination
language: rust
severity: error
category: security
message: "Suspicious // SAFETY comment. Verify the code is actually unsafe."
note: "AI generates // SAFETY: comments on safe code, or with hallucinated justifications on unsafe code."
rule:
  kind: line_comment
  all:
    - regex: '//\s*SAFETY\s*:'
    - not:
        inside:
          kind: unsafe_block
          stopBy: end
    - not:
        precedes:
          any:
            - kind: unsafe_block
            - kind: expression_statement
              has:
                kind: unsafe_block
            - kind: let_declaration
              has:
                kind: unsafe_block
ignores:
  - "**/tests/**"
  - "**/test_*"
  - "**/*_test.rs"
skip_test_code: true
tests:
  should_match:
    - |
      fn foo() {
          // SAFETY: this is safe because we checked the length
          let x = vec![1, 2, 3];
      }
    - |
      // SAFETY: the pointer is valid
      let x = 42;
  should_not_match:
    - |
      fn foo() {
          // SAFETY: p is valid and aligned
          unsafe { ptr::read(p) };
      }
    - |
      unsafe {
          // SAFETY: exclusively owned
          *raw = 42;
      }
