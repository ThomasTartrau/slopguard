id: no-safety-hallucination
language: rust
severity: error
category: security
message: "Suspicious // SAFETY comment. Verify the code is actually unsafe."
note: "AI generates // SAFETY: comments on safe code, or with hallucinated justifications on unsafe code."
rule:
  kind: line_comment
  all:
    # Plain comment only: /// SAFETY doc-comments on unsafe fns are legitimate.
    - regex: '^//\s*SAFETY\s*:'
    - not:
        inside:
          kind: unsafe_block
          stopBy: end
    # The next non-comment sibling (statement, item, expression) contains
    # unsafe code at any depth.
    - not:
        precedes:
          regex: '\bunsafe\b'
          stopBy:
            not:
              kind: line_comment
    # Inside a macro body tree-sitter only sees tokens: fall back to text.
    - not:
        inside:
          kind: token_tree
          regex: '\bunsafe\b'
          stopBy: end
    - not:
        inside:
          kind: block
          has:
            kind: unsafe_block
            stopBy: end
ignores:
  - "**/tests/**"
  - "**/test_*"
  - "**/*_test.rs"
  - "**/fixtures/**"
skip_test_code: true
tests:
  should_match:
    - |
      fn foo() {
          // SAFETY: this is safe because we checked the length
          let x = vec![1, 2, 3];
      }
    - |
      // SAFETY: the pointer is valid
      let x = 42;
  should_not_match:
    - |
      fn foo() {
          // SAFETY: p is valid and aligned
          unsafe { ptr::read(p) };
      }
    - |
      unsafe {
          // SAFETY: exclusively owned
          *raw = 42;
      }
    - |
      fn multi_line() {
          // SAFETY: p is valid
          // and aligned
          let x = unsafe { ptr::read(p) };
      }
    - |
      fn nested() {
          // SAFETY: p is valid
          if let Some(x) = unsafe { ptr::read(p) } {
              drop(x);
          }
      }
    - |
      /// SAFETY: the caller must hold the lock.
      unsafe fn with_lock() {}
    - |
      // SAFETY: T is Send because the pointer is never shared.
      unsafe impl<T> Send for Wrapper<T> {}
