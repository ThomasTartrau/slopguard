id: no-unsafe-without-safety
language: rust
severity: error
category: security
message: "unsafe block without // SAFETY: comment. Document why this is safe."
note: "Every unsafe block must be preceded by a // SAFETY: comment explaining the invariant."
rule:
  kind: unsafe_block
  not:
    any:
      - follows:
          kind: line_comment
          regex: 'SAFETY'
      - inside:
          any:
            - kind: expression_statement
            - kind: let_declaration
          follows:
            kind: line_comment
            regex: 'SAFETY'
ignores:
  - "**/tests/**"
  - "**/test_*"
  - "**/*_test.rs"
  - "**/fixtures/**"
skip_test_code: true
tests:
  should_match:
    - |
      fn foo() {
          unsafe { ptr::read(p) };
      }
    - |
      fn bar() {
          // This is fine
          unsafe { *raw = 42; }
      }
  should_not_match:
    - |
      fn foo() {
          // SAFETY: p is valid and aligned, checked by the caller
          unsafe { ptr::read(p) };
      }
    - |
      fn bar() {
          // SAFETY: raw is non-null and exclusively owned
          unsafe { *raw = 42; }
      }
