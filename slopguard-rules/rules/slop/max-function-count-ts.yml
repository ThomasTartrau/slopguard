id: max-function-count-ts
language: typescript
severity: warning
category: slop
metric: function_count
threshold: 30
message: "File defines more than 30 functions ($value functions). Split it into focused modules."
note: "Arrow functions and class methods count too. A file with this many entry points is hard to review as a unit."
ignores:
  - "**/fixtures/**"
tests:
  should_match_files:
    - "fixtures/metrics/ts_large.ts"
  should_not_match_files:
    - "fixtures/metrics/ts_small.ts"
