id: max-function-count
language: rust
severity: warning
category: slop
metric: function_count
threshold: 30
skip_test_code: true
message: "File defines more than 30 functions ($value functions). Split it into focused modules."
note: "Methods and nested functions count too, closures do not. A file with this many entry points is hard to review as a unit."
ignores:
  - "**/fixtures/**"
tests:
  should_match_files:
    - "fixtures/metrics/rust_large.rs"
  should_not_match_files:
    - "fixtures/metrics/rust_small.rs"
