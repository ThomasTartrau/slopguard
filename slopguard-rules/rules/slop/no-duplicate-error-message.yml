id: no-duplicate-error-message
language: rust
severity: warning
category: slop
cross_file: duplicate_error_message
message: "Same error message literal used in more than one file. Extract a shared constant or a typed error."
note: "An error message copied verbatim across files (from panic!, .expect(), bail!, anyhow!, and similar) is hard to trace back to its source and drifts out of sync. Define it once. Only literals of 10 characters or more are considered, and duplication inside a single file is ignored."
fix: "Move the message to a shared const or an error enum variant and reference it from both sites."
skip_test_code: true
ignores:
  - "**/target/**"
  - "**/fixtures/**"
