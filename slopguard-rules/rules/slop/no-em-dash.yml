id: no-em-dash
language: rust
severity: warning
category: slop
message: "Em dash (U+2014) in source. Use a plain hyphen or rewrite."
note: "The em dash is a classic AI writing marker. Keep source copy-paste safe."
rule:
  any:
    - kind: line_comment
    - kind: block_comment
    - kind: string_literal
  regex: '\x{2014}'
ignores:
  - "**/fixtures/**"
tests:
  should_match:
    - "// this — that"
    - "let s = \"a — b\";"
  should_not_match:
    - "// plain - hyphen"
    - "let s = \"no dash here\";"
