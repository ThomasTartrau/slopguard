id: no-glob-reexport
language: rust
severity: warning
category: slop
message: "pub use module::*. Use explicit re-exports to control the public API."
note: "Glob re-exports make the public API implicit and risk accidental exports."
fix: "List the re-exported items explicitly: pub use module::{A, B};"
# `scan --fix` lists the module's pub items, read from its inline block or its
# module.rs / module/mod.rs file. Safe: it lists exactly what the glob exports
# today, and gives up when that set is not readable from the source (cfg-gated
# items, item-generating macros, nested globs, pub(crate) items, a module
# reached through crate:: or super::, a name another glob or item also binds).
fixer: explicit_reexport
autofix_safe: true
rule:
  pattern: pub use $MODULE::*;
files:
  - "**/src/**/*.rs"
ignores:
  - "**/fixtures/**"
tests:
  should_match:
    - "pub use crate::models::*;"
    - "pub use self::handlers::*;"
  should_not_match:
    - "pub use crate::models::User;"
    - "use crate::models::*;"
  should_fix:
    - before: |
        mod models {
            pub struct User;
            pub fn load() {}
            pub mod admin {}
            fn private() {}
            impl User {}
        }

        pub use models::*;
      after: |
        mod models {
            pub struct User;
            pub fn load() {}
            pub mod admin {}
            fn private() {}
            impl User {}
        }

        pub use models::{User, admin, load};
    # A cfg-gated item may or may not exist: left as written.
    - before: |
        mod models {
            pub struct User;
            #[cfg(feature = "admin")]
            pub struct Admin;
        }

        pub use models::*;
      after: |
        mod models {
            pub struct User;
            #[cfg(feature = "admin")]
            pub struct Admin;
        }

        pub use models::*;
