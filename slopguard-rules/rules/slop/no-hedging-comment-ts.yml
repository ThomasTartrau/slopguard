id: no-hedging-comment
language: typescript
severity: warning
category: slop
message: "Hedging language in comment. Be precise or remove."
note: "AI pattern: 'hopefully', 'should work', 'might need' betray uncertainty (AntiSlop)."
rule:
  kind: comment
  regex: '\b(hopefully|should work|might need|probably works|not sure if|I think|I believe|I assume|as far as I know)\b'
ignores:
  - "**/fixtures/**"
tests:
  should_match:
    - "// hopefully this works"
    - "// should work for most cases"
    - "// might need refactoring later"
    - "/* probably works with the new API */"
  should_not_match:
    - "// Parses the input string"
    - "// Requires a valid token"
    - "/* Returns null on invalid input */"
    - "// This is the correct approach"
