id: no-inline-qualified-path
language: rust
severity: warning
category: slop
message: "Inline qualified path. Use a `use` import at the top of the file."
note: "AI generates code with fully qualified paths instead of adding imports."
rule:
  all:
    - any:
        - kind: scoped_identifier
        - kind: scoped_type_identifier
    - any:
        - regex: '^(std|serde|serde_json|chrono)::\w+::\w+'
        - regex: '^(reqwest|tokio|sqlx|base64|url)::\w+::\w+'
        - regex: '^aws_sdk_\w+::\w+::\w+'
    - not:
        inside:
          kind: use_declaration
          stopBy: end
    - not:
        inside:
          kind: attribute_item
          stopBy: end
ignores:
  - "**/fixtures/**"
tests:
  should_match:
    - "let v = std::collections::HashMap::new();"
    - "let dur = tokio::time::Duration::from_secs(5);"
  should_not_match:
    - |
      use std::collections::HashMap;
      let map: HashMap<String, i32> = HashMap::new();
    - "let x = crate::utils::helper();"
    - "use std::io::Error as IoError;"
    - |
      use std::fmt::{Display, Formatter};
    - "use std::sync::atomic::{AtomicUsize, Ordering};"
    - "use std::collections::hash_map::Entry;"
