id: no-manual-rfc3339
language: rust
severity: warning
category: slop
message: ".to_rfc3339() is usually redundant. DateTime<Utc> serializes to RFC3339 natively via serde."
note: "If the field type is String, change it to DateTime<Utc>. Serde + chrono handles the format."
rule:
  pattern: $X.to_rfc3339()
ignores:
  - "**/tests/**"
  - "**/*_tests/**"
  - "**/*_test/**"
  - "**/test_*"
  - "**/*_test.rs"
  - "**/fixtures/**"
skip_test_code: true
tests:
  should_match:
    - "let s = now.to_rfc3339();"
    - "let ts = created_at.to_rfc3339();"
  should_not_match:
    - "let s = now.format(\"%Y-%m-%d\").to_string();"
    - "let s = now.to_string();"
