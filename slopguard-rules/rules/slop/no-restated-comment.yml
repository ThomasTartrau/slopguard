id: no-restated-comment
language: rust
severity: warning
category: slop
message: "Comment restating the code. Remove it, the code is already readable."
note: "AI pattern: '// increment the counter' above counter += 1."
rule:
  all:
    - kind: line_comment
    - any:
        - regex: '^//\s*(increment|decrement|set|get)\s+(the\s+)?\w+'
        - regex: '^//\s*(return|check|validate|create)\s+(the\s+)?\w+'
        - regex: '^//\s*(update|delete|remove|add|init)\s+(the\s+)?\w+'
        - regex: '^//\s*(initialize|call|invoke|send)\s+(the\s+)?\w+'
        - regex: '^//\s*(fetch|load|save|store|parse)\s+(the\s+)?\w+'
        - regex: '^//\s*(convert|transform|iterate|loop)\s+(the\s+)?\w+'
        - regex: '^//\s*(log|print|import|export)\s+(the\s+)?\w+'
ignores:
  - "**/tests/**"
  - "**/fixtures/**"
skip_test_code: true
tests:
  should_match:
    - "// increment the counter"
    - "// create the user"
    - "// fetch the data"
  should_not_match:
    - "// BUG: increment wraps at u32::MAX, see issue #42"
    - "/// Returns the parsed config"
    - "// TODO: refactor this later"
    - "/// call site: the scan continues without AI"
    - "//! load the plugin registry at startup"
