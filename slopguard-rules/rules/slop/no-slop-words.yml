id: no-slop-words
language: rust
severity: warning
category: slop
message: "AI filler word in a comment. Rephrase or remove."
note: "These words appear 1000x more often in LLM text than in human text (ANTISLOP paper, ICLR 2026)."
rule:
  any:
    - kind: line_comment
    - kind: block_comment
  regex: '\b(comprehensive|robust|seamless|leverage|utilize|facilitate|streamline|endeavor|foster|delve|intricate|nuanced|pivotal|myriad|plethora|paramount|cutting.edge|state.of.the.art|best.in.class|industry.leading|game.changing)\b|\b[Hh]arness(es|ed|ing)?\s+(the|its|their|our|your|this|these|those)\b|\b[Hh]arnessing\b'
ignores:
  - "**/fixtures/**"
tests:
  should_match:
    - "// This provides a comprehensive overview"
    - "// Leverage the robust framework"
    - "/* A seamless integration layer */"
    - "// We harness the power of async"
    - "// Harnessing modern tooling"
  should_not_match:
    - "// This function parses the input"
    - "// Returns the user count"
    - "/* Helper for date formatting */"
    - "// Rust test-harness lines"
    - "// the Kubernetes side of the harness"
