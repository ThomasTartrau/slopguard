id: no-slop-words
language: rust
severity: warning
category: slop
message: "AI filler word in a comment. Rephrase or remove."
note: "These words appear 1000x more often in LLM text than in human text (ANTISLOP paper, ICLR 2026)."
rule:
  any:
    - kind: line_comment
    - kind: block_comment
  regex: '\b(seamless|utilize|facilitate|streamline|endeavor|foster|delve|intricate|pivotal|myriad|plethora|paramount|cutting.edge|state.of.the.art|best.in.class|industry.leading|game.changing)\b'
ignores:
  - "**/fixtures/**"
tests:
  should_match:
    - "/* A seamless integration layer */"
    - "// We need to utilize this framework"
    - "// This will streamline the process"
  should_not_match:
    - "// This function parses the input"
    - "// Returns the user count"
    - "/* Helper for date formatting */"
    - "// This provides a comprehensive overview"
    - "// Leverage the robust framework"
