id: no-stub-return
language: rust
severity: warning
category: slop
enabled: false
message: "Function body is a single bare constant. Looks like an unimplemented stub."
note: "A function with a declared return type whose whole body is true/false/None/vec![]/Vec::new() returns a placeholder instead of real logic. Opt-in rule (getters and Default impls can look similar): enable in slopguard.toml."
rule:
  any:
    - pattern: 'fn $N($$$P) -> $R { true }'
    - pattern: 'fn $N($$$P) -> $R { false }'
    - pattern: 'fn $N($$$P) -> $R { None }'
    - pattern: 'fn $N($$$P) -> $R { vec![] }'
    - pattern: 'fn $N($$$P) -> $R { Vec::new() }'
    - pattern: 'fn $N($$$P) -> $R { return true; }'
    - pattern: 'fn $N($$$P) -> $R { return false; }'
    - pattern: 'fn $N($$$P) -> $R { return None; }'
ignores:
  - "**/fixtures/**"
tests:
  should_match:
    - "fn is_ready(&self) -> bool { true }"
    - "fn items(&self) -> Vec<Item> { vec![] }"
    - "fn find(&self, id: u32) -> Option<Item> { None }"
  should_not_match:
    - "fn is_ready(&self) -> bool { self.ready }"
    - "fn count(&self) -> usize { self.items.len() }"
