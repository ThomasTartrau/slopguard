id: no-trivial-function
language: rust
severity: warning
category: slop
message: "Trivial wrapper function. Inline it or call the target directly."
note: "AI adds pass-through functions that only forward a call or read a field."
rule:
  kind: function_item
  has:
    field: body
    kind: block
    all:
      - not:
          has:
            kind: let_declaration
            stopBy: neighbor
      - not:
          has:
            kind: expression_statement
            stopBy: neighbor
      - has:
          any:
            - kind: field_expression
            - all:
                - kind: call_expression
                - has:
                    field: function
                    kind: identifier
                    not:
                      regex: '^(Self|[A-Z])'
                    stopBy: neighbor
          stopBy: neighbor
ignores:
  - "**/fixtures/**"
skip_test_code: true
tests:
  should_match:
    - "fn name(&self) -> String { self.name }"
    - "fn run(x: i32) -> i32 { compute(x) }"
  should_not_match:
    - "fn calc(a: i32, b: i32) -> i32 { let s = a + b; s * 2 }"
    - "fn process(items: &[i32]) -> i32 { items.iter().sum() }"
